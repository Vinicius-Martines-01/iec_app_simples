name: CI Pipeline - WordPress

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~
            if [ ! -d "iec_app_teste" ]; then
              git clone https://github.com iec_app_teste
            fi
            cd iec_app_teste
            git pull origin main
            cd wordpress
            docker compose up -d --build
