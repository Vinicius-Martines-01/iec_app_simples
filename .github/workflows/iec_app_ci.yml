name: CI Pipeline - WordPress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install # Removido o '|| echo' para garantir que falhe se houver erro real

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar vulnerabilidade
        run: npm audit --audit-level=high

  quality:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Rodar lint
        run: npm run lint

      - name: Run Coverage
        run: npm run test -- --coverage

      - name: Analise com SonarCloud 
        uses: SonarSource/sonarcloud-github-action@v2 
        with: 
          args: > 
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.sources=.
            -Dsonar.verbose=true
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build e Push com Docker Compose
        run: |
          docker compose build
          docker compose push
        working-directory: ./wordpress

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Subir Ambiente de teste
        run: |
          docker compose up -d
          echo "Aguardando banco de dados..."
          sleep 20 # Tempo para o MySQL iniciar corretamente
        working-directory: ./wordpress

      - name: Validar Comunicacao (Ping)
        run: docker compose exec -T wordpress ping -c 1 db
        working-directory: ./wordpress

      - name: Rodar testes unitarios (NPM)
        run: npm test
        working-directory: ./wordpress

  deploy: 
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy via SSH (Appleboy)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # No servidor, apenas puxamos a imagem nova e subimos
            # Isso evita depender de Git no servidor de produção
            cd ~/iec_app_teste || mkdir -p ~/iec_app_teste && cd ~/iec_app_teste
            
            # Se o docker-compose.yml não estiver lá, você precisará copiá-lo via SCP antes
            docker compose pull
            docker compose up -d
            docker image prune -f # Limpa imagens antigas para não encher o disco
