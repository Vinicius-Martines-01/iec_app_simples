<!DOCTYPE html>
<html>
<head>
    <title>FATEC ToDo List</title>
    <style>body { font-family: sans-serif; padding: 20px; }</style>
</head>
<body>
    <h1>Minhas Tarefas</h1>
    <input type="text" id="taskInput" placeholder="Nova tarefa">
    <button onclick="addTask()">Adicionar</button>
    <ul id="taskList"></ul>

    <script>
        const API_URL = window.location.origin; // Usa a mesma URL/Porta que carregou o site

        async function loadTasks() {
            try {
                const res = await fetch(`${API_URL}/tarefas`);
                const tasks = await res.json();
                const list = document.getElementById('taskList');
                list.innerHTML = tasks.map(t => `<li>${t.titulo}</li>`).join('');
            } catch (err) {
                console.error("Erro ao carregar tarefas:", err);
            }
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value) return;
            
            try {
                await fetch(`${API_URL}/tarefas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo: input.value })
                });
                input.value = '';
                loadTasks();
            } catch (err) {
                console.error("Erro ao adicionar tarefa:", err);
            }
        }
        loadTasks();
    </script>
</body>
</html>
