services:
  db: 
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: fatec_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: user_fatec
      MYSQL_PASSWORD: password_fatec
    volumes:
      - db_data:/var/lib/mysql
    # Adicionado um healthcheck básico para o banco também, 
    # garantindo que o WP só tente conectar quando o DB estiver pronto.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pfatec_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: ${DOCKER_IMAGE:-wordpress-fatec:latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8031:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: user_fatec
      WORDPRESS_DB_PASSWORD: password_fatec
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8031');
        define('WP_SITEURL', 'http://localhost:8031');
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/97035240"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data: