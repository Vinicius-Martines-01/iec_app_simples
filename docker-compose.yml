services:
  db:
    image: postgres:15-alpine
    container_name: vini_db
    environment:
      POSTGRES_USER: fatec_user
      POSTGRES_PASSWORD: fatec_password
      POSTGRES_DB: todolist
    volumes:
      - vini_data:/var/lib/postgresql/data

  api:
    image: ${DOCKER_USER:-vini_user}/vini-backend:latest
    build: ./backend
    container_name: vini_api
    restart: always
    environment:
      DB_HOST: db
    depends_on:
      - db
    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/tarefas"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s  

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
  web:
    image: ${DOCKER_USER:-vini_user}/vini-frontend:latest
    build: ./frontend
    container_name: vini_web
    ports:
      - "8031:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  vini_data:
