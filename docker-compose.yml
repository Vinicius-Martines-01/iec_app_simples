services:
  db:
    image: postgres:15-alpine
    container_name: vini_db
    environment:
      POSTGRES_USER: fatec_user
      POSTGRES_PASSWORD: fatec_password
      POSTGRES_DB: todolist
    volumes:
      - vini_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    image: ${DOCKER_USER:-vini_user}/vini-backend:latest
    build: ./backend
    container_name: vini_api
    restart: always
    environment:
      DB_HOST: db
    depends_on:
      - db
    ports:
      - "8031:3000"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/tarefas', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s  

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vini_data:
